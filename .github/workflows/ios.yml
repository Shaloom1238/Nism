name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Install Capacitor 7
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 --legacy-peer-deps

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.shalom.nism",
            "appName": "NISM Exam Prep",
            "webDir": "dist"
          }
          EOF

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS application
        run: npx cap sync ios

      - name: Build iOS application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r NISM-Exam-Prep.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NISM-Exam-Prep-IPA
          path: NISM-Exam-Prep.ipa
