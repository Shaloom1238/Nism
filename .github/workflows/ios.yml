
name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Fix TypeScript compatibility
        run: npm install --save-dev typescript@5.9.3 --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Initialize Capacitor
        run: npx cap init "NISM Exam Prep" com.shalom.nism --web-dir dist

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS application
        run: npx cap sync ios

      - name: Resolve iOS dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build iOS application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r NISM-Exam-Prep.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NISM-Exam-Prep-IPA
          path: NISM-Exam-Prep.ipa
